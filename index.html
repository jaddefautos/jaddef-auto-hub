<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is calculator</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #0b0c0c;
            font-family: sans-serif;
            outline: none;  
        }
        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator{
            background-color: #000;
            padding: 15px;
            border-radius: 30px;
            box-shadow: inset 5px 5px 12px #ffffffff,5px 5px 12px rgb(32, 32, 32);
            display: grid;
            grid-template-columns: repeat(4, 68px);
        }
        input{
            grid-column: span 4;
            height: 70px;
            width: 260px;
            background-color: #ecf0f3;
            box-shadow: inset -5px -5px 12px #ffffffff, inset 5px 5px 12px rgb(26, 25, 25);
            border: none;
            border-radius: 30px;
            color: rgba(70, 70, 70);
            font-size: 50px;
            text-align: end;
            margin: auto;
            margin-top: 40px;
            margin-bottom: 30px;
            padding: 20px;
        }
        button{
            height: 48px;
            width: 48px;
            background-color: #ecf0f3;
            box-shadow: -5px -5px 12px #ffffffff 5px 5px 12px rgb(19, 17, 17);
            border: none;
            border-radius: 50%;
            margin: 8px;
            font-size: 20px;
        }
        .equal{
            width: 120px;
            border-radius: 50px;
            background-color: #ecf0f3;
            box-shadow: -5px -5px 12px #ffffffff 5px 5px 12px rgb(19, 18, 18);

        }
        .button{
            width: 60px;
            border-radius: 50px;
            background-color: #ecf0f3;
            box-shadow: -5px -5px 12px #ffffffff 5px 5px 12px rgb(22, 2, 2);
        }
    </style>
</head>
   <center><h1>GOODDY CALCULATOR</h1></center>
<body>
    <div class="container">
        <div class="calculator">
            <input type="text" placeholder="0" id="outputscreen">
            <button onclick="clearoutputscreen()" class="button"> CL</button>
            <button onclick="del()" class="button" >DEL</button>
            <button onclick="display('%')" class="button">%</button>
            <button onclick="display('/')" class="button">/</button>
            <button onclick="display('7')" class="button">7</button>
            <button onclick="display('8')" class="button">8</button>
            <button onclick="display('9')" class="button">9 </button>
            <button onclick="display('*')" class="button">*</button>
            <button onclick="display('4')" class="button">4</button>
            <button onclick="display('5')" class="button">5</button>
            <button onclick="display('6')" class="button">6</button>
            <button onclick="display('-')" class="button">-</button>
            <button onclick="display('1')" class="button">1</button>
            <button onclick="display('2')" class="button">2</button>
            <button onclick="display('3')" class="button">3</button>
            <button onclick="display('+')" class="button">+</button>
            <button onclick="display('.')" class="button">.</button>
            <button onclick="display('0')" class="button">0</button>
            <button onclick="calculate()" class="equal">=</button>

        </div>

    </div>
    <script>
        let outputscreen = document.getElementById("outputscreen")
        function display(num){
            outputscreen.value +=num;
        }
        function calculate(){
            try{
                outputscreen.value =eval(outputscreen.value);
            } catch(error){
                alert("invalid");
            }
        }
        function clearoutputscreen(){
            outputscreen.value =";"
        }
        function del(){
            outputscreen.value = outputscreen.value.slice(0, -1)
        }
    </script>
</body>
</html>
